<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MaoGE账号登录</title>


<style>

*{

box-sizing:border-box;

font-family:
"Roboto",
"Microsoft YaHei",
Arial,sans-serif;

}



body{

margin:0;

background:#f4f4f4;

color:#333;

}



/* 顶部 */

header{

height:56px;

background:#2196F3;

color:white;

display:flex;

align-items:center;

padding-left:20px;

font-size:21px;

box-shadow:
0 2px 5px rgba(0,0,0,.25);

}



/* 登录卡片 */


.login-box{

width:90%;

max-width:360px;

background:white;

margin:55px auto;

padding:25px;

border-radius:10px;

box-shadow:
0 2px 8px rgba(0,0,0,.15);

text-align:center;

}



/* 头像 */


.avatar{

width:75px;

height:75px;

background:#2196F3;

border-radius:50%;

margin:auto;

position:relative;

}


/* 人形 */

.avatar:before{

content:"";

position:absolute;

width:20px;

height:20px;

background:white;

border-radius:50%;

left:27px;

top:14px;

}



.avatar:after{

content:"";

position:absolute;

width:42px;

height:22px;

background:white;

border-radius:22px 22px 5px 5px;

left:16px;

bottom:12px;

}




.title{

margin-top:15px;

font-size:20px;

font-weight:bold;

}



.subtitle{

font-size:13px;

color:#888;

margin-top:6px;

}





input{

width:100%;

height:42px;

margin-top:15px;

border:1px solid #ddd;

border-radius:5px;

padding-left:14px;

font-size:15px;

}



button{

width:100%;

height:42px;

margin-top:22px;

border:0;

border-radius:5px;

background:#2196F3;

color:white;

font-size:16px;

}



.links{

margin-top:18px;

font-size:14px;

color:#2196F3;

}



.notice{

margin-top:20px;

font-size:12px;

color:#999;

}



.back{

display:block;

text-align:center;

margin-top:30px;

color:#777;

font-size:14px;

text-decoration:none;

}



</style>

</head>



<body>



<header>

MaoGE账号

</header>




<div class="login-box">



<div class="avatar"></div>




<div class="title">

MaoGE用户登录

</div>


<div class="subtitle">

登录后管理您的资源站信息

</div>




<input placeholder="账号">


<input placeholder="密码" type="password">




<button onclick="login()">

登录

</button>




<div class="links">

注册账号　|　忘记密码

</div>




<div class="notice">

MaoGE资源站用户系统

<br>

数据服务状态：正常

</div>




</div>





<a class="back" href="index.html">

返回资源站首页

</a>







<script>


function login(){

alert("亲爱的\n您的用户名或密码错误");

}



</script>



</body>

</html>
